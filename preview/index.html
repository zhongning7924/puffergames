<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>愤怒河豚的弹弓 - 本地预览</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #1b1b2f;
    display: flex; align-items: center; justify-content: center;
    font-family: Arial, "PingFang SC", sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; }
  #game {
    background: #87CEEB;
    display: block;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    touch-action: none;
  }
  #hint {
    position: absolute; bottom: 10px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 12px; opacity: .75;
    pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hint">浏览器本地预览版 · 拖动河豚瞄准发射</div>
</div>

<script>
/* 截图模式参数预处理（须在适配层之前）：?dpr=2.88 覆写 devicePixelRatio，
   让画布后备存储达到目标分辨率（1080×1920 = 375×667 × 2.88） */
(function () {
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  window.__shot = q;
  if (q.dpr) {
    var d = parseFloat(q.dpr);
    try { Object.defineProperty(window, 'devicePixelRatio', { value: d, configurable: true }); }
    catch (e) { window.devicePixelRatio = d; }
  }
})();
</script>
<script>
/**
 * 浏览器版 wx API 适配层
 * 把微信小游戏的 wx.* 调用映射到标准 HTML5 Canvas / DOM，
 * 并把鼠标/触摸事件转换成微信 touch 事件格式。
 */
(function () {
  const SCREEN_W = 375, SCREEN_H = 667;
  const dpr = window.devicePixelRatio || 1;
  const canvas = document.getElementById('game');
  canvas.style.width = SCREEN_W + 'px';
  canvas.style.height = SCREEN_H + 'px';
  canvas.width = Math.round(SCREEN_W * dpr);
  canvas.height = Math.round(SCREEN_H * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const touchHandlers = {};
  function bind(type, wxType) {
    canvas.addEventListener(type, function (e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      let cx, cy;
      if (type === 'touchend' || type === 'touchcancel') {
        const t = (e.changedTouches && e.changedTouches[0]);
        cx = t ? t.clientX : 0; cy = t ? t.clientY : 0;
      } else {
        const t = (e.touches && e.touches[0]) || e;
        cx = t.clientX; cy = t.clientY;
      }
      const x = (cx - rect.left) * (SCREEN_W / rect.width);   // CSS 像素 → 舞台坐标（画布可被 CSS 放大）
      const y = (cy - rect.top) * (SCREEN_H / rect.height);
      const tobj = { clientX: x, clientY: y, identifier: 0 };
      const evt = {
        touches: (type === 'touchend' || type === 'touchcancel') ? [] : [tobj],
        changedTouches: [tobj],
      };
      if (touchHandlers[wxType]) touchHandlers[wxType](evt);
    }, { passive: false });
  }
  bind('mousedown', 'touchstart');
  bind('mousemove', 'touchmove');
  bind('mouseup', 'touchend');
  bind('touchstart', 'touchstart');
  bind('touchmove', 'touchmove');
  bind('touchend', 'touchend');
  bind('touchcancel', 'touchcancel');

  // 微信语义：createCanvas 首次返回上屏画布，之后返回离屏画布
  var mainCanvasUsed = false;
  window.wx = {
    createCanvas: function () {
      if (!mainCanvasUsed) { mainCanvasUsed = true; return canvas; }
      return document.createElement('canvas');
    },
    getSystemInfoSync: function () {
      return {
        screenWidth: SCREEN_W, screenHeight: SCREEN_H, devicePixelRatio: dpr,
        windowWidth: SCREEN_W, windowHeight: SCREEN_H, statusBarHeight: 0,
        safeArea: { top: 0, bottom: SCREEN_H, left: 0, right: SCREEN_W },
      };
    },
    getStorageSync: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    setStorageSync: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    vibrateShort: function () { if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} } },
    vibrateLong: function () { if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} } },
    onTouchStart: function (cb) { touchHandlers.touchstart = cb; },
    onTouchMove: function (cb) { touchHandlers.touchmove = cb; },
    onTouchEnd: function (cb) { touchHandlers.touchend = cb; },
    onTouchCancel: function (cb) { touchHandlers.touchcancel = cb; },
  };
  // 浏览器原生 requestAnimationFrame / cancelAnimationFrame 已存在，无需覆盖
})();
</script>
<script src="bundle.js"></script>
<script>
/**
 * 截图模式（供无头 Chrome 取材，不影响正常预览）
 * ?shot=1&dpr=2.88  画布铺满窗口、原生分辨率、隐藏提示浮层
 * ?scene=select|play|boss  自动进入选关页 / 第 1 关 / 第 8 关（章王）
 * ?prog=N           预置解锁进度（配合 boss 场景）
 */
(function () {
  var q = window.__shot || {};
  var shot = q.shot === '1' || !!q.scene || !!q.dpr;

  if (shot) {
    // 画布 CSS 尺寸铺满窗口（后备存储已是 dpr×舞台，视觉 1:1 原生像素）
    var c = document.getElementById('game');
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    c.style.borderRadius = '0';
    c.style.boxShadow = 'none';
    document.getElementById('hint').style.display = 'none';
    document.body.style.background = '#04121f';
  }
  if (q.prog) {
    try {
      localStorage.setItem('angryBirds_progress',
        JSON.stringify({ unlockedLevels: parseInt(q.prog, 10) || 1, stars: {} }));
    } catch (e) {}
  }

  var scene = q.scene || '';
  if (!scene) return;

  function click(x, y) {
    var c = document.getElementById('game');
    var r = c.getBoundingClientRect();
    var k = r.width / 375;                 // CSS 尺寸 → 舞台坐标换算
    var opts = {
      bubbles: true, cancelable: true, button: 0,
      clientX: r.left + x * k, clientY: r.top + y * k,
    };
    c.dispatchEvent(new MouseEvent('mousedown', opts));
    c.dispatchEvent(new MouseEvent('mouseup', opts));
  }

  // 用 rAF 帧计数定时，避免依赖真实时钟
  var frame = 0, step = 0;
  requestAnimationFrame(function loop() {
    frame++;
    if (step === 0 && frame >= 12) {
      step = 1;
      if (scene === 'select' || scene === 'play' || scene === 'boss') {
        click(187, 358);                   // 「开始游戏」
      }
    }
    if (step === 1 && frame >= 24) {
      step = 2;
      if (scene === 'play') click(85.5, 194);    // 第 1 关（新手湾 2×4 网格 r1c1）
      else if (scene === 'boss') click(289.5, 270); // 第 8 关（章王，r2c4）
    }
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
